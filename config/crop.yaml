# Crop settings for the Tomato Harvest POC (owner: lane L05).
# Every value has a comment naming its source. The full table, with "what changes if it is wrong",
# is docs/assumptions.md; the `assumptions:` list at the end is the machine-readable copy that
# publish.py turns into app/data/assumptions.json.
#
# "Paper" = Maree et al. 2025, Sensors 25(14):4321, doi:10.3390/s25144321 (checked in a browser 14 Nov 2026).
# Keys match tests/fixtures/crop.yaml; values marked PROPOSED are G1 decisions.
#
# D10 (14 Nov 2026): price and re-spacing cost now follow the paper, as approved by the user.

crop: dwarf tomato (potted, sold as whole pots)   # Paper §2.2: 'Pick-&-Joy Red Cherry', 13 cm pots
planted: 2024-09-03          # Paper §2.1: transplanting on 3 Sep 2024 (all rooms). D17: the pipeline reads each room's own date from config/customers.yaml; this is the default
base_temp_c: 10.0            # Convention for tomato degree-days; matches main's gdd_cum (first day 22.7 °C -> 12.7). Not checked in a primary source.

ripeness:
  sample_weight: 0.7         # Team choice (SPEC §4): how far a crop sample pulls the curve; 0 = ignore, 1 = pass through it
  onset_red_index: 0.1       # main's forecast.py ONSET_MIN: % of photo that is red fruit, 3 days running = ripening started
  onset_days: 3              # main's photo-onset rule (SPEC §4)
  rate_days: 7               # Team choice (SPEC §4): future warmth per day = mean of the last N days
  plant_spread_sd: 12.5      # Data: pooled sd of % red across plants in the 5 Nov hand weighings (main, README)
  horizon_days: 21           # Team choice (SPEC §5): days ahead the harvest window looks
  # D12: starting guess used only before any room has a ripe crop sample (strict "known by today").
  prior_k: 0.03              # main's forecast.py starting value for the curve slope
  prior_g50: 750.0           # main's starting value: degree-days at 50% red
  prior_g50_sd: 60.0         # wide spread so confidence reads low while only the guess is available

economics:
  sellable_red_share: 0.3333 # Paper §2.5 and §3.1: unsellable if under one third of fruit (by weight) is red. VERIFIED
  red_cap_g: 150.0           # Paper §3.1 and Fig. 3: red fruit above 150 g per pot adds nothing. VERIFIED
  # D10. Price per pot (before the EUR 0.75 plant cost) by red fruit grams per pot, read off Paper Fig. 3 (about ±EUR 0.02).
  # Piecewise linear between points, flat beyond the last one (150 g cap). Zero up to 50 g (Paper §3.1 minimum), then a
  # straight rise to 80 g; the line is continuous, so just above 50 g the price is just above zero.
  # Low line applies at fruit dry matter <= 7 %, high at >= 8 % (linear in between, Fig. 3 caption). Dry matter is not
  # in the data, so the low line is the main case (4 of 6 rooms were below 7 %, Table 1).
  # Check: Table 1 gains per pot (price - plant cost) are reproduced for all six rooms (tests/test_settings.py).
  gains_curve_low:  [[0, 0.0], [50, 0.0], [80, 1.60], [150, 1.80]]   # EUR per pot, dry matter <= 7 %. VERIFIED
  gains_curve_high: [[0, 0.0], [50, 0.0], [80, 1.80], [150, 2.00]]   # EUR per pot, dry matter >= 8 %. VERIFIED
  price_eur_per_pot: 1.80    # Paper Fig. 3: full-value price, low line at 150 g. VERIFIED
  price_low: 1.80            # D10: main case is already the low dry-matter line
  price_high: 2.00           # Paper Fig. 3: full-value price at dry matter >= 8 %
  plant_cost_eur: 0.75       # Paper §2.5: seed, pot, soil and propagation, EUR 0.75 per pot. VERIFIED
  respacing_cost_eur_m2_year: 1.50  # Paper §2.5: per spacing step, per m2 per year, inside daily fixed costs (not one-off). VERIFIED
  # Other paper costs, for reference (room logs already carry running costs; totals are 4-7 % below Table 1):
  #   fixed EUR 18.125/m2/year; lamps EUR 0.07 per µmol/(m2 s) installed per year; EUR 0.10/pot per intervention (§2.6, not used).
  #   Table 1 "average density" = harmonic mean, 1 / mean(1/density).
  cost_rate_days: 7          # Team choice (SPEC §5): future daily cost = mean of the last 7 days of the room log
  earliest_sellable_share: 0.95   # PROPOSED (SPEC §5): "earliest sellable day" = this share of pots sellable
  harvest_now_share: 0.90         # PROPOSED: status harvest_now needs at least this share sellable today
  area_m2: 96.0                   # Paper §2.2: six equal compartments of 96 m2. VERIFIED

growth:                      # Shipping extension: when fruit stops gaining weight (harvest/growth.py)
  complete_share: 0.98       # Team choice: fruit counts as "finished growing" at 98% of its final weight
  prior_steepness: 0.0148    # Data: fruit-weight S-curve steepness per degree-day, fitted on all six rooms' weighings (full season). In production: the grower's previous crop
  prior_half_gdd: 474.0      # Data: degree-days at half the final fruit weight, same fit; used only before 3 weighings exist
  min_rooms: 3               # Team choice: fit the timing on today's weighings once this many other rooms have 3+

logistics:                   # Shipping extension: truck, distance and shelf (harvest/logistics.py, harvest/shipping.py)
  transit_temp_c: 13.0       # Common practice for partly ripe tomato: 12-15 °C; below ~10 °C causes chilling damage. Not from the dataset
  shop_temp_c: 20.0          # Typical retail / home room temperature. Not from the dataset
  driving_hours_per_day: 8   # Team choice (one driver, 8 h at the wheel)
  avg_speed_kmh: 70          # Loaded truck incl. traffic and stops (EU trucks are limited to 90 km/h)
  same_day_km: 300           # Up to this distance the pots arrive the same day
  max_transit_days: 4        # Potted plants yellow and drop fruit after ~3-4 days in a dark truck. General guidance
  best_band_pct_red: [70, 90]   # Team assumption: pots look their best from 70 % to 90 % of fruit weight red
  end_of_life_pct_red: 94    # Team assumption: off the shelf once 94 % red (soft, cracking, fruit drop)
  min_best_shelf_days: 5     # Team choice: ship-by day leaves at least this many days in best condition
  default_destination: munich
  destinations:              # Approximate road distances from Bleiswijk (NL); not route-planned
    - {id: local, name: Local market (Rotterdam), distance_km: 30}
    - {id: paris, name: Paris, distance_km: 500}
    - {id: munich, name: Munich, distance_km: 850}
    - {id: barcelona, name: Barcelona, distance_km: 1500}
    - {id: madrid, name: Madrid, distance_km: 1750}

confidence:                  # Team choice, approved by the user (D11); level = worst of the three parts
  day_range_high_max: 7      # best-day range (days) at most this -> high (D11: real ranges are 6-12 days)
  day_range_medium_max: 12   # at most this -> medium, else low
  agree_points: 10           # camera / sample within this many points of the forecast -> agree
  conflict_points: 20        # more than this apart -> conflict, between -> mixed
  fresh_high_max: 7          # days since newest sample or usable photo at most this -> high (D11)
  fresh_medium_max: 14       # (D11)

alerts:                      # PROPOSED thresholds (team choice)
  schedule_points: 15        # sample or camera outside the band by more than this -> behind/ahead
  flatline_days: 3           # same reading this many days running -> sensor check
  drift_share: 0.15          # 7-day warmth rate this far below the other rooms' median -> drift
  ranges:                    # Plausible daily means for the sensor check (L03 defaults; screening bounds, not crop targets)
    T_mean: {min: 5, max: 40}
    RH_mean: {min: 20, max: 100}
    CO2_mean: {min: 200, max: 2000}
    DLI: {min: 0, max: 40}

# Machine-readable assumption list for app/data/assumptions.json (contract: name, value, unit, source, if_wrong).
# `key` points at the setting above so the value is never typed twice.
assumptions:
  - name: Pot sells only if this share of its fruit is red
    key: economics.sellable_red_share
    unit: share of fruit weight
    source: Challenge rules, Maree et al. 2025 §2.5 (verified)
    if_wrong: Earliest sellable day moves; best day moves with it.
  - name: Red fruit counted up to
    key: economics.red_cap_g
    unit: g per pot
    source: Challenge rules, Maree et al. 2025 §3.1 and Fig. 3 (verified)
    if_wrong: A higher cap rewards waiting longer; best day would move later.
  - name: Price per pot at full value
    key: economics.price_eur_per_pot
    unit: EUR per pot
    source: Challenge price chart, Maree et al. 2025 Fig. 3 (verified; EUR 2.00 if fruit dry matter is 8 % or more)
    if_wrong: Profit level changes; best day barely moves.
  - name: Plant cost
    key: economics.plant_cost_eur
    unit: EUR per pot
    source: Challenge rules, Maree et al. 2025 §2.5 (verified)
    if_wrong: Profit level shifts by the same amount per pot; best day does not move.
  - name: Re-spacing cost
    key: economics.respacing_cost_eur_m2_year
    unit: EUR per m2 per year, per step
    source: Challenge rules, Maree et al. 2025 §2.5 (verified)
    if_wrong: Spacing is done before harvest decisions, so profit level changes but best day barely moves.
  - name: Room area
    key: economics.area_m2
    unit: m2
    source: Maree et al. 2025 §2.2 (verified)
    if_wrong: Only euro totals per room change.
  - name: Base temperature for warmth (degree-days)
    key: base_temp_c
    unit: °C
    source: Common tomato convention; matches the team's derived tables
    if_wrong: Ripening speed per warm day shifts; the what-if slider is most affected.
  - name: Plant-to-plant spread in ripeness
    key: ripeness.plant_spread_sd
    unit: points of % red
    source: 5 Nov hand weighings, 6 plants per room (dataset)
    if_wrong: Wider spread delays the day 95% of pots are sellable.
  - name: Future warmth and cost per day
    key: ripeness.rate_days
    unit: days averaged
    source: Team choice (mean of the last 7 days)
    if_wrong: A cold or warm spell ahead moves the best day by a day or two.
  - name: Earliest sellable day needs this share of pots sellable
    key: economics.earliest_sellable_share
    unit: share of pots
    source: Team choice (proposed)
    if_wrong: A lower bar shows an earlier date.
  - name: Fruit counts as finished growing at
    key: growth.complete_share
    unit: share of final fruit weight
    source: Team choice; growth curve fitted on the crop weighings
    if_wrong: A higher share moves the earliest pluck day later.
  - name: Fruit-weight curve steepness
    key: growth.prior_steepness
    unit: per degree-day
    source: Fitted on all six rooms' weighings (this season); in production, the grower's previous crop
    if_wrong: A flatter curve finishes growing later, so the pluck day moves later.
  - name: Truck temperature
    key: logistics.transit_temp_c
    unit: °C
    source: Common practice for partly ripe tomato (12-15 °C); not from the dataset
    if_wrong: A warmer truck ripens pots on the road; they arrive riper with fewer shelf days.
  - name: Shop temperature
    key: logistics.shop_temp_c
    unit: °C
    source: Typical retail room temperature; not from the dataset
    if_wrong: A warmer shop shortens the days in best condition.
  - name: Driving per day
    key: logistics.driving_hours_per_day
    unit: hours at 70 km/h
    source: Team choice (one driver)
    if_wrong: Two drivers halve the days on the road for far destinations.
  - name: Pots come off the shelf at
    key: logistics.end_of_life_pct_red
    unit: "% of fruit weight red"
    source: Team assumption, general post-harvest practice (best condition is taken as 70-90 % red)
    if_wrong: Shifts the sell-by date and the ship-by day.
