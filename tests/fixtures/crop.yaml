# Fixture copy of the crop settings. L05 owns config/crop.yaml and keeps these keys.
# Values marked PROPOSED are G1 decisions.
crop: dwarf tomato (potted, sold as whole pots)
planted: 2024-09-03
base_temp_c: 10.0            # degree-day base temperature
ripeness:
  sample_weight: 0.7         # how far a crop sample pulls the curve (0 = ignore, 1 = pass through it)
  onset_red_index: 0.1       # % of photo that is red fruit, 3 days running, to call ripening started
  onset_days: 3
  rate_days: 7               # future warmth per day = mean of the last N days
  plant_spread_sd: 12.5      # plant-to-plant spread in % red mid-ripening (5 Nov weighings)
  spread_mid_pct: [5, 95]    # D19: weighings used to fit the spread (room mean % red in this range)
  spread_min_rooms: 3        # D19: fit the spread once this many other rooms have such a weighing (full season)
  horizon_days: 21
economics:
  sellable_red_share: 0.3333 # a pot sells only if at least this share of fruit weight is red
  red_cap_g: 150.0           # red fruit above this per pot adds no revenue
  # D10: verified against Maree et al. 2025 (Fig. 3, Table 1). Price per pot depends on red fruit grams,
  # piecewise linear between these points; dry matter is not in the data, so 'low' (<=7% DM) is the main case.
  # Points checked by L05 against Fig. 3 (continuous: zero at 50 g, straight rise to 80 g).
  gains_curve_low:  [[0, 0.0], [50, 0.0], [80, 1.60], [150, 1.80]]   # EUR per pot, dry matter <= 7%
  gains_curve_high: [[0, 0.0], [50, 0.0], [80, 1.80], [150, 2.00]]   # EUR per pot, dry matter >= 8%
  price_eur_per_pot: 1.80    # full-value price, main case (low curve at 150 g)
  price_low: 1.80
  price_high: 2.00
  plant_cost_eur: 0.75
  respacing_cost_eur_m2_year: 1.50   # per spacing step, charged per m2 per year as a fixed cost (not one-off)
  cost_rate_days: 7
  earliest_sellable_share: 0.95   # PROPOSED: "earliest sellable day" = this share of pots sellable
  harvest_now_share: 0.90         # PROPOSED: status harvest_now needs at least this share sellable today
  optimal_zone_share: 0.90        # D16: optimal zone = profit within 10 % of the best day
  area_m2: 96.0                   # room area for euro totals (paper §2.2: 96 m2 compartments)
confidence:                  # PROPOSED thresholds; level = worst of the three parts
  day_range_high_max: 4      # best-day range (days) at most this -> high
  day_range_medium_max: 8    # at most this -> medium, else low
  agree_points: 10           # camera / sample within this many points of the forecast -> agree
  conflict_points: 20        # more than this apart -> conflict, between -> mixed
  fresh_high_max: 3          # days since newest sample or usable photo at most this -> high
  fresh_medium_max: 7
alerts:
  schedule_points: 15        # sample or camera outside the band by more than this -> behind/ahead
  flatline_days: 3
  drift_share: 0.15          # 7-day warmth rate this far below the other rooms' median -> drift

growth:                      # Shipping extension: when fruit stops gaining weight (harvest/growth.py)
  complete_share: 0.98       # Team choice: fruit counts as "finished growing" at 98% of its final weight
  prior_steepness: 0.0148    # Data: fruit-weight S-curve steepness per degree-day, fitted on all six rooms' weighings (full season). In production: the grower's previous crop
  steepness_from: other_rooms_full_season   # D19: previous-crop stand-in (other five rooms, full season)
  steepness_bounds: [0.003, 0.1]
  prior_half_gdd: 474.0      # Data: degree-days at half the final fruit weight, same fit; used only before 3 weighings exist
  min_rooms: 3               # Team choice: fit the timing on today's weighings once this many other rooms have 3+

logistics:                   # Shipping extension: truck, distance and shelf (harvest/logistics.py, harvest/shipping.py)
  transit_temp_c: 13.0       # Common practice for partly ripe tomato: 12-15 °C; below ~10 °C causes chilling damage. Not from the dataset
  shop_temp_c: 20.0          # Typical retail / home room temperature. Not from the dataset
  driving_hours_per_day: 8   # Team choice (one driver, 8 h at the wheel)
  avg_speed_kmh: 70          # Loaded truck incl. traffic and stops (EU trucks are limited to 90 km/h)
  same_day_km: 300           # Up to this distance the pots arrive the same day
  max_transit_days: 4        # Potted plants yellow and drop fruit after ~3-4 days in a dark truck. General guidance
  best_band_pct_red: [70, 90]   # Team assumption: pots look their best from 70 % to 90 % of fruit weight red
  end_of_life_pct_red: 94    # Team assumption: off the shelf once 94 % red (soft, cracking, fruit drop)
  min_best_shelf_days: 5     # Team choice: ship-by day leaves at least this many days in best condition
  default_destination: munich
  destinations:              # Approximate road distances from Bleiswijk (NL); not route-planned
    - {id: local, name: Local market (Rotterdam), distance_km: 30}
    - {id: paris, name: Paris, distance_km: 500}
    - {id: munich, name: Munich, distance_km: 850}
    - {id: barcelona, name: Barcelona, distance_km: 1500}
    - {id: madrid, name: Madrid, distance_km: 1750}

